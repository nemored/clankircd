[workspace]
members = [
  "crates/protocol",
  "crates/server-core",
  "crates/transport",
  "crates/config",
  "bin/clankircd",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "WTFPL"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
